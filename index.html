<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日语 × 英语 · 100 天学习计划</title>
<style>
:root{
  --bg:#0c1016; --bg2:#0f141b; --panel:#141a23; --panel2:#182029;
  --line:#232c38; --line2:#33404f;
  --text:#e8eef6; --muted:#93a1b3; --muted2:#6d7b8c;
  --en:#38bdf8; --en-soft:rgba(56,189,248,.13);
  --ja:#fb7185; --ja-soft:rgba(251,113,133,.13);
  --gold:#f5c451; --ok:#34d399;
  --radius:16px;
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --jp:"Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Microsoft YaHei",sans-serif;
}
body.light{
  --bg:#f6f7f9; --bg2:#ffffff; --panel:#ffffff; --panel2:#f2f4f7;
  --line:#e3e7ed; --line2:#cfd6e0;
  --text:#111a26; --muted:#5b6779; --muted2:#8a95a5;
  --en:#0284c7; --en-soft:rgba(2,132,199,.09);
  --ja:#e11d48; --ja-soft:rgba(225,29,72,.08);
  --gold:#b7791f; --ok:#059669;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1100px 600px at 8% -10%,rgba(56,189,248,.09),transparent 60%),
    radial-gradient(900px 560px at 96% 4%,rgba(251,113,133,.08),transparent 62%),
    var(--bg);
  color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid transparent;background-clip:content-box}
#app{display:grid;grid-template-columns:266px minmax(0,1fr);min-height:100vh}

/* ---------- sidebar ---------- */
.side{border-right:1px solid var(--line);padding:20px 16px 28px;position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,var(--bg2),transparent 40%)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--en),var(--ja));display:grid;place-items:center;font-size:14px;font-weight:800;color:#08111a}
.brand h1{font-size:14.5px;margin:0;letter-spacing:.3px;font-weight:700}
.brand p{margin:2px 0 0;font-size:11px;color:var(--muted2);letter-spacing:.4px}

.ringbox{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:16px}
.ring{--p:0;width:62px;height:62px;border-radius:50%;flex:0 0 62px;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel)}
.ring b{position:relative;font-size:13px;font-weight:700}
.ringbox .txt small{display:block;color:var(--muted2);font-size:11px;margin-bottom:3px;letter-spacing:.3px}
.ringbox .txt strong{font-size:16px}
.ringbox .txt em{font-style:normal;color:var(--muted);font-size:12px}

.sec-title{font-size:11px;color:var(--muted2);letter-spacing:1.4px;text-transform:uppercase;margin:16px 2px 8px;font-weight:700}
.daygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.daygrid button{
  height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;transition:.16s;font-family:var(--font);
}
.daygrid button:hover{border-color:var(--line2);color:var(--text)}
.daygrid button.part{border-color:rgba(56,189,248,.45);color:var(--en);background:var(--en-soft)}
.daygrid button.done{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.15);color:var(--ok)}
.daygrid button.cur{outline:2px solid var(--text);outline-offset:1px}
.legend{display:flex;gap:12px;margin-top:10px;font-size:10.5px;color:var(--muted2);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px}

/* ---------- main ---------- */
main{min-width:0;padding:0 30px 80px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:16px 0 12px;background:linear-gradient(180deg,var(--bg) 62%,transparent);backdrop-filter:blur(6px)}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;color:var(--muted);font-size:13px;padding:7px 15px;border-radius:9px;cursor:pointer;font-family:var(--font);font-weight:600;transition:.16s}
.tabs button.on{background:var(--panel2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.search{flex:1;max-width:340px;margin-left:auto;position:relative}
.search input{width:100%;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 12px 0 34px;font-size:13px;font-family:var(--font);outline:none;transition:.16s}
.search input:focus{border-color:var(--line2);background:var(--panel2)}
.search span{position:absolute;left:12px;top:9px;color:var(--muted2);font-size:13px}
.iconbtn{height:38px;width:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:15px;display:grid;place-items:center;transition:.16s}
.iconbtn:hover{color:var(--text);border-color:var(--line2)}

.dayhead{display:flex;align-items:flex-end;gap:16px;padding:14px 2px 18px;flex-wrap:wrap}
.dayhead .num{font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1;background:linear-gradient(135deg,var(--text),var(--muted));-webkit-background-clip:text;background-clip:text;color:transparent}
.dayhead .num small{font-size:14px;font-weight:700;letter-spacing:0;color:var(--muted2);-webkit-text-fill-color:var(--muted2);margin-right:6px}
.dayhead .themes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.chip{font-size:11.5px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.chip.en{border-color:rgba(56,189,248,.3);color:var(--en);background:var(--en-soft)}
.chip.ja{border-color:rgba(251,113,133,.3);color:var(--ja);background:var(--ja-soft)}
.dayhead .pct{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:10px}
.dayhead .pct b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.bar{width:130px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--en),var(--ja));border-radius:99px;transition:width .3s}

section.block{margin-bottom:34px}
.blockhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.blockhead .tag{font-size:10.5px;font-weight:800;letter-spacing:1.2px;padding:4px 8px;border-radius:6px}
.blockhead .tag.en{color:var(--en);background:var(--en-soft)}
.blockhead .tag.ja{color:var(--ja);background:var(--ja-soft)}
.blockhead h2{font-size:15px;margin:0;font-weight:700;letter-spacing:.4px}
.blockhead .sub{color:var(--muted2);font-size:12px}
.blockhead .spacer{flex:1}
.mini{border:0;background:transparent;color:var(--muted2);font-size:12px;cursor:pointer;font-family:var(--font);padding:4px 6px;border-radius:6px}
.mini:hover{color:var(--text);background:var(--panel)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px 15px 13px;cursor:pointer;transition:border-color .18s,transform .18s,background .18s}
.card:hover{border-color:var(--line2);transform:translateY(-1px)}
.card.open{background:var(--panel2);border-color:var(--line2)}
.card .w{font-size:18.5px;font-weight:650;letter-spacing:.2px;padding-right:26px;line-height:1.35}
.card.ja .w{font-family:var(--jp);font-size:19px;font-weight:600}
.card .meta{font-size:11.5px;color:var(--muted2);margin-top:5px;letter-spacing:.2px}
.card .meta .pos{color:var(--muted);font-weight:600}
.card .rv{max-height:0;overflow:hidden;opacity:0;transition:max-height .26s ease,opacity .2s ease}
.card.open .rv{max-height:300px;opacity:1;margin-top:11px}
.card .cn{font-size:13.5px;line-height:1.6;color:var(--text)}
.card .ex{margin-top:9px;padding-left:10px;border-left:2px solid var(--line2);font-size:12.5px;line-height:1.65;color:var(--muted)}
.card .ex b{display:block;font-weight:500;color:var(--muted)}
.card .ex span{display:block;color:var(--muted2);font-size:12px;margin-top:2px}
.card .star{position:absolute;top:9px;right:8px;width:26px;height:26px;border:0;background:transparent;color:var(--muted2);font-size:15px;cursor:pointer;border-radius:7px;line-height:1;transition:.15s}
.card .star:hover{background:rgba(245,196,81,.12);color:var(--gold)}
.card.mastered .star{color:var(--gold)}
.card.mastered{border-color:rgba(245,196,81,.35)}
.card.seen .w::after{content:"·";margin-left:7px;color:var(--ok);font-weight:800}

.gcard{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:15px;padding:17px 18px 15px;margin-top:12px;position:relative}
.gcard .gtop{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.gcard .gno{font-size:10.5px;letter-spacing:1.2px;color:var(--muted2);font-weight:800}
.gcard h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:.3px}
.gcard .star{position:absolute;top:12px;right:12px;width:28px;height:28px;border:0;background:transparent;color:var(--muted2);font-size:16px;cursor:pointer;border-radius:8px}
.gcard .star:hover{background:rgba(245,196,81,.12);color:var(--gold)}
.gcard.mastered .star{color:var(--gold)}
.gcard.mastered{border-color:rgba(245,196,81,.35)}
.formula{display:inline-block;font-size:13.5px;line-height:1.6;padding:8px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:600;margin-bottom:9px}
.formula.jp{font-family:var(--jp);font-weight:500}
.gcard .note{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 10px}
.gcard ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.gcard li{font-size:13px;line-height:1.6;padding-left:12px;border-left:2px solid var(--line2)}
.gcard li b{font-weight:600;display:block;color:var(--text)}
.gcard li b.jp{font-family:var(--jp);font-weight:500}
.gcard li span{color:var(--muted2);font-size:12.5px}

.reslist{display:grid;gap:8px;margin-top:6px}
.res{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;transition:.15s}
.res:hover{border-color:var(--line2);background:var(--panel2)}
.res .rw{font-size:15px;font-weight:650;min-width:130px}
.res .rw.jp{font-family:var(--jp);font-weight:600}
.res .rm{color:var(--muted);font-size:12.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rd{font-size:11px;color:var(--muted2);border:1px solid var(--line);padding:2px 7px;border-radius:99px}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:6px 0 26px}
.stat{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:15px 16px}
.stat small{display:block;font-size:11px;color:var(--muted2);letter-spacing:.6px;margin-bottom:6px}
.stat b{font-size:23px;font-weight:750;letter-spacing:-.5px}
.stat b i{font-style:normal;font-size:12px;color:var(--muted2);font-weight:600;margin-left:3px}
.panelbox{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:18px;margin-bottom:16px}
.panelbox h3{margin:0 0 12px;font-size:13.5px;letter-spacing:.4px}
.rows{display:grid;gap:10px}
.rowline{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted)}
.rowline .nm{width:96px;flex:0 0 96px}
.rowline .bar{flex:1;width:auto}
.rowline .vl{width:64px;text-align:right;color:var(--muted2);font-variant-numeric:tabular-nums}

.empty{color:var(--muted2);font-size:13px;padding:26px 0}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 16px;border-radius:10px;font-size:13px;cursor:pointer;font-family:var(--font);font-weight:600;transition:.15s}
.btn:hover{border-color:var(--line2)}
.btn.accent{background:linear-gradient(135deg,var(--en),#6366f1);border:0;color:#fff}
.kbd{font-size:11px;color:var(--muted2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin:0 2px}

@media(max-width:900px){
  #app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .daygrid{grid-template-columns:repeat(10,1fr)}
  main{padding:0 16px 70px}
  .dayhead .num{font-size:34px}
  .search{max-width:none}
}

/* ---------- quiz ---------- */
.quizsetup h3{margin:0 0 8px;font-size:14px}
.qnote{color:var(--muted);font-size:12.5px;margin:0 0 18px;line-height:1.6}
.qrow{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.qlab{flex:0 0 40px;font-size:12px;color:var(--muted2);padding-top:6px;letter-spacing:1px}
.qchips{display:flex;gap:8px;flex-wrap:wrap}
.chip.pick{cursor:pointer;background:var(--panel2);user-select:none;transition:.15s}
.chip.pick:hover{border-color:var(--line2)}
.chip.pick.sel{background:var(--en-soft);border-color:rgba(56,189,248,.5);color:var(--en);font-weight:700}
.qstart{margin-top:6px;padding:10px 26px}
.quizcard{max-width:680px;margin:6px 0 30px;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:26px 28px;position:relative}
.qprompt{font-size:22px;font-weight:700;line-height:1.5;letter-spacing:.3px;margin-bottom:8px}
.qprompt.jp{font-family:var(--jp)}
.qsub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.qsub .gt{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--en-soft);color:var(--en);font-weight:700;margin-right:6px;font-size:12px}
.qsub .gf{font-family:var(--font);font-weight:600;color:var(--text)}
.qsub .gf.jp{font-family:var(--jp)}
.speakbtn{position:absolute;top:20px;right:22px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.15s;font-family:var(--font)}
.speakbtn:hover{border-color:var(--line2)}
.speakbtn.playing{background:var(--en-soft);border-color:rgba(56,189,248,.5);color:var(--en)}
.qinputrow{display:flex;gap:10px;margin-top:6px}
.qinputrow input{flex:1;height:46px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:0 14px;font-size:16px;font-family:var(--font);outline:none}
.qinputrow input:focus{border-color:var(--line2)}
.qinputrow .btn{height:46px;padding:0 22px}
.qopts{display:grid;gap:10px;margin-top:4px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:13px 16px;border-radius:12px;font-size:15px;cursor:pointer;transition:.15s;font-family:var(--font);line-height:1.5}
.opt:hover{border-color:var(--line2)}
.opt.jp{font-family:var(--jp)}
.opt.correct{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.13);color:var(--ok)}
.opt.wrong{border-color:rgba(251,113,133,.6);background:rgba(251,113,133,.13);color:var(--ja)}
.opt.off{opacity:.5}
.fb{margin-top:18px;padding:13px 16px;border-radius:12px;font-size:14px;font-weight:700;line-height:1.5}
.fb.ok{background:rgba(52,211,153,.13);color:var(--ok);border:1px solid rgba(52,211,153,.4)}
.fb.no{background:rgba(251,113,133,.13);color:var(--ja);border:1px solid rgba(251,113,133,.4)}
.fbexplain{margin-top:10px;padding:13px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}
.fbexplain.jp{font-family:var(--jp)}
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="brand">
      <div class="dot">あ</div>
      <div><h1>日语 × 英语 · 100 天</h1><p>10 词 + 1 语法 / 天 / 语言</p></div>
    </div>
    <div class="ringbox">
      <div class="ring" id="ring"><b id="ringNum">0%</b></div>
      <div class="txt">
        <small>总掌握进度</small>
        <strong id="ringTxt">0 / 2200</strong>
        <em id="ringSub">今日 0 / 22</em>
      </div>
    </div>
    <div class="sec-title">Day 选择</div>
    <div class="daygrid" id="daygrid"></div>
    <div class="legend">
      <span><i style="background:rgba(52,211,153,.7)"></i>已完成</span>
      <span><i style="background:rgba(56,189,248,.6)"></i>进行中</span>
      <span><i style="background:var(--line)"></i>未开始</span>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div class="tabs" id="tabs">
        <button data-tab="today" class="on">今日学习</button>
        <button data-tab="review">随机抽测</button>
        <button data-tab="stats">学习进度</button>
      </div>
      <div class="search"><span>⌕</span><input id="q" placeholder="搜索单词 / 释义 / 语法…" autocomplete="off"></div>
      <button class="iconbtn" id="themeBtn" title="切换主题">◐</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>

CURRICULUM.push({"d":1,"en":{"theme":"教育与学习","words":[{"w":"acquire","p":"/əˈkwaɪə(r)/","pos":"v.","cn":"获得；学到","ex":"Children acquire language skills very quickly.","exCn":"孩子们很快就能习得语言技能。"},{"w":"attend","p":"/əˈtend/","pos":"v.","cn":"出席；参加","ex":"All students must attend the meeting tomorrow morning.","exCn":"全体学生明天上午必须参加会议。"},{"w":"knowledge","p":"/ˈnɒlɪdʒ/","pos":"n.","cn":"知识","ex":"Reading widely helps you gain a lot of knowledge.","exCn":"广泛阅读能帮助你获得大量知识。"},{"w":"lecture","p":"/ˈlektʃə(r)/","pos":"n.","cn":"讲座；课","ex":"The professor gave an interesting lecture on history.","exCn":"教授做了一场有趣的历史讲座。"},{"w":"major","p":"/ˈmeɪdʒə(r)/","pos":"n.","cn":"专业","ex":"She chose economics as her major last year.","exCn":"她去年选了经济学作为专业。"},{"w":"graduate","p":"/ˈɡrædʒueɪt/","pos":"v.","cn":"毕业","ex":"He will graduate from college next June.","exCn":"他明年六月大学毕业。"},{"w":"research","p":"/rɪˈsɜːtʃ/","pos":"n.","cn":"研究；调查","ex":"Their research on climate change is very important.","exCn":"他们关于气候变化的研究非常重要。"},{"w":"progress","p":"/ˈprəʊɡres/","pos":"n.","cn":"进步；进展","ex":"You have made great progress in spoken English.","exCn":"你的英语口语进步很大。"},{"w":"ability","p":"/əˈbɪləti/","pos":"n.","cn":"能力","ex":"He has the ability to solve difficult problems.","exCn":"他有解决难题的能力。"},{"w":"concentrate","p":"/ˈkɒnsntreɪt/","pos":"v.","cn":"集中；专心","ex":"It is hard to concentrate in a noisy room.","exCn":"在吵闹的房间里很难集中注意力。"}],"grammar":{"title":"一般现在时：习惯与客观事实","formula":"主语 + 动词原形 / 第三人称单数 + 其他","cn":"一般现在时表示经常性、习惯性的动作或客观真理。第三人称单数作主语时动词要加 -s 或 -es，否定和疑问用 do 或 does 构成。标志词有 always、usually、often、every day 等。客观事实永远用一般现在时。","quiz":{"q":"My brother ___ to school by bike every day.","options":["go","goes","going","gone"],"a":1,"explain":"主语 My brother 是第三人称单数，一般现在时的习惯动作用 goes，动词加 -es。"},"ex":[{"s":"I get up at six every day.","t":"我每天六点起床。"},{"s":"Water boils at 100 degrees.","t":"水在100度沸腾。"}]}},"ja":{"theme":"あいさつと基本表現","words":[{"k":"こんにちは","y":"こんにちは","cn":"你好","ex":"こんにちは、先生。","exCn":"老师，您好。"},{"k":"おはよう", ":"公园","ex":"公園で子供たちが遊んでいます。","exCn":"孩子们在公园里玩。"},{"k":"図書館","y":"としょかん","cn":"图书馆","ex":"図書館は静かでいいです。","exCn":"图书馆很安静，很好。"},{"k":"銀行","y":"ぎんこう","cn":"银行","ex":"銀行は九時に開きます。","exCn":"银行九点开门。"},{"k":"上","y":"うえ","cn":"上面","ex":"机の上に本があります。","exCn":"桌子上有书。"},{"k":"下","y":"した","cn":"下面","ex":"椅子の下に猫がいます。","exCn":"椅子下面有猫。"},{"k":"前","y":"まえ","cn":"前面","ex":"駅の前に花屋があります。","exCn":"车站前面有花店。"},{"k":"後ろ","y":"うしろ","cn":"后面","ex":"家の後ろに山があります。","exCn":"家后面有山。"},{"k":"隣","y":"となり","cn":"旁边；隔壁","ex":"隣の部屋は空いています。","exCn":"隔壁房间空着。"}],"grammar":{"title":"助词「で」：场所与手段","formula":"N（场所/手段）で 〜","cn":"「で」表示动作进行的场所，例如在图书馆学习；它还表示手段、工具或语言，例如用笔写、用日语说。它与表示存在场所的「に」不同：房间里有桌子用「に」，在房间里学习用「で」。","quiz":{"q":"私は図書館 ___ 勉強します。","options":["で","に","を","へ"],"a":0,"explain":"「で」表示动作进行的场所，『在图书馆学习』用「で」，不用「に」。"},"ex":[{"s":"図書館で勉強します。","t":"在图书馆学习。"},{"s":"バスで学校へ行きます。","t":"坐公交车去学校。"}]}}});

。","exCn":"昨天的派对很愉快。"},{"k":"寂しい","y":"さびしい","cn":"寂寞的","ex":"一人で少し寂しいです。","exCn":"一个人有点寂寞。"},{"k":"怖い","y":"こわい","cn":"可怕的","ex":"夜の道は怖いです。","exCn":"夜路很可怕。"},{"k":"痛い","y":"いたい","cn":"疼的","ex":"頭が痛くて眠れません。","exCn":"头疼得睡不着。"},{"k":"心配","y":"しんぱい","cn":"担心","ex":"母は私のことを心配しています。","exCn":"母亲在担心我。"},{"k":"安心","y":"あんしん","cn":"安心；放心","ex":"無事だと聞いて安心しました。","exCn":"听说平安无事，我就放心了。"},{"k":"気持ち","y":"きもち","cn":"心情；感觉","ex":"今の気持ちを話してください。","exCn":"请说说你现在的心情。"},{"k":"泣く","y":"なく","cn":"哭","ex":"子供が急に泣き出しました。","exCn":"孩子突然哭了起来。"}],"grammar":{"title":"动词的ます形","formula":"V（ます形）","cn":"「ます形」是动词的礼貌形式，用于一般叙述和日常会话。一类动词把词尾从う段改为い段再加「ます」，二类动词去掉「る」加「ます」，「する」和「来る」是不规则动词，分别为「します」「来ます」。","quiz":{"q":"毎日日本語を ___ 。（勉強する → ます形）","options":["勉強します","勉強するます","勉強しました","勉強ます"],"a":0,"explain":"「する」是不规则动词，ます形为「します」，『勉強する』变『勉強します』。"},"ex":[{"s":"毎日日本語を勉強します。","t":"每天学习日语。"},{"s":"朝七時に起きます。","t":"早上七点起床。"}]}}});

れました。","exCn":"这座寺庙建于一千年前。"},{"k":"神社","y":"じんじゃ","cn":"神社","ex":"正月に神社へ行きます。","exCn":"新年去神社参拜。"},{"k":"城","y":"しろ","cn":"城堡","ex":"あの城はとても有名です。","exCn":"那座城堡很有名。"},{"k":"温泉","y":"おんせん","cn":"温泉","ex":"冬は温泉に入りたいです。","exCn":"冬天想泡温泉。"},{"k":"お土産","y":"おみやげ","cn":"特产；礼物","ex":"家族にお土産を買いました。","exCn":"给家人买了特产。"},{"k":"案内","y":"あんない","cn":"向导；引导","ex":"町を案内してあげます。","exCn":"我带你逛逛这个城市。"},{"k":"地図","y":"ちず","cn":"地图","ex":"地図で場所を確認します。","exCn":"用地图确认地点。"},{"k":"ホテル","y":"ほてる","cn":"酒店","ex":"ホテルは駅の近くにあります。","exCn":"酒店在车站附近。"},{"k":"旅館","y":"りょかん","cn":"日式旅馆","ex":"古い旅館に泊まりました。","exCn":"我住了一家老式旅馆。"}],"grammar":{"title":"动词ません与ました","formula":"V ません / V ました / V ませんでした","cn":"动词礼貌体的否定用「ません」，如「行きません」；过去肯定用「ました」，如「行きました」；过去否定用「ませんでした」。这三种形式都接在ます形的词干之后，是日常会话中最常用的否定和过去表达。","quiz":{"q":"今日は学校へ ___ 。（行く → 否定）","options":["行きません","行きます","行きでした","行くません"],"a":0,"explain":"动词礼貌体否定用「ません」，『行く』变『行きません』。"},"ex":[{"s":"今日は学校へ行きません。","t":"今天不去学校。"},{"s":"昨日映画を見ました。","t":"昨天看了电影。"}]}}});

CURRICULUM.push({"d":90,"en":{"theme":"文化与认同","words":[{"w":"identity","p":"/aɪˈdentəti/","pos":"n.","cn":"身份；认同","ex":"Language is part of cultural identity.","exCn":"语言是文化认同的一部分。"},{"w":"ancestry","p":"/ˈænsestri/","pos":"n.","cn":"祖先；血统","ex":"She takes pride in her African ancestry.","exCn":"她为自己非洲血统感到自豪。"},{"w":"pluralism","p":"/ˈplʊərəlɪzəm/","pos":"n.","cn":"多元化；多元主义","ex":"Cultural pluralism greatly enriches the whole society.","exCn":"文化多元主义极大地丰富了整个社会。"},{"w":"assimilate","p":"/əˈsɪməleɪt/","pos":"v.","cn":"同化；吸收","ex":"Immigrants gradually assimilated into society.","exCn":"移民逐渐融入了社会。"},{"w":"tribal","p":"/ˈtraɪbl/","pos":"adj.","cn":"部落的；部族的","ex":"These tribal customs are centuries old.","exCn":"这些部落习俗已有数百年历史。"},{"w":"civilization","p":"/ˌsɪvəlaɪˈzeɪʃn/","pos":"n.","cn":"文明","ex":"Ancient civilization left many treasures.","exCn":"古代文明留下了许多珍宝。"},{"w":"perpetuate","p":"/pəˈpetʃueɪt/","pos":"v.","cn":"使延续；使永存","ex":"Festivals perpetuate ancient traditions.","exCn":"节日使古老传统得以延续。"},{"w":"globalization","p":"/ˌɡləʊbəlaɪˈzeɪʃn/","pos":"n.","cn":"全球化","ex":"Globalization connects the whole world.","exCn":"全球化把整个世界连在一起。"},{"w":"legacy","p":"/ˈleɡəsi/","pos":"n.","cn":"遗产；遗留","ex":"The great writer left a rich legacy.","exCn":"这位伟大作家留下了丰富的遗产。"},{"w":"doctrine","p":"/ˈdɒktrɪn/","pos":"n.","cn":"学说；信条","ex":"The doctrine shaped the community's beliefs.","exCn":"这一信条塑造了社区的信仰。"}],"grammar":{"title":"写作高级句型：复合句连接与衔接","formula":"主句; however/therefore/moreover, 主句","cn":"however（然而）、therefore（因此）、moreover（此外）等连接副词用来衔接两个句子，表达转折、因果、递进关系。它们不能直接连接两个句子，前面要用分号或句号，后面通常加逗号。这与 because、although 等从属连词用法不同。","quiz":{"q":"He studied hard; ___, he passed the exam easily.","options":["therefore","because","although","if"],"a":0,"explain":"前后是因果关系，therefore 表示「因此」，且前有分号，符合连接副词用法。"},"ex":[{"s":"He studied hard; therefore, he passed the exam easily.","t":"他学习努力，因此轻松通过了考试。"},{"s":"The plan is good; however, it costs too much.","t":"计划不错，然而成本太高。"}]}},"ja":{"theme":"性格と人間関係","words":[{"k":"人柄","y":"ひとがら","cn":"人品；为人","ex":"彼は人柄がとてもいいです。","exCn":"他为人很好。"},{"k":"誠実","y":"せいじつ","cn":"诚实；真诚","ex":"誠実な人だと信じています。","exCn":"相信他是诚实的人。"},{"k":"素直","y":"すなお","cn":"坦率；老实","ex":"素直に謝るべきです。","exCn":"应该坦诚道歉。"},{"k":"厳しい","y":"きびしい","cn":"严格；严厉","ex":"あの先生は厳しいです。","exCn":"那位老师很严厉。"},{"k":"社交的","y":"しゃこうてき","cn":"善于交际的","ex":"彼女は社交的です。","exCn":"她很善于交际。"},{"k":"積極的","y":"せっきょくてき","cn":"积极的","ex":"もっと積極的になりましょう。","exCn":"变得更积极一些吧。"},{"k":"消極的","y":"しょうきょくてき","cn":"消极的","ex":"彼は少し消極的です。","exCn":"他有点消极。"},{"k":"信頼","y":"しんらい","cn":"信赖","ex":"部下から信頼されています。","exCn":"他受到部下的信赖。"},{"k":"仲良く","y":"なかよく","cn":"关系好；和睦","ex":"二人は仲良く遊んでいます。","exCn":"两人关系很好地一起玩。"},{"k":"人間関係","y":"にんげんかんけい","cn":"人际关系","ex":"職場の人間関係に悩んでいます。","exCn":"为职场的人际关系而烦恼。"}],"grammar":{"title":"递进表达：～ばかりでなく","formula":"～ばかりでなく ～も","cn":"「～ばかりでなく」表示「不仅…而且…」，与「～だけでなく」意思相同，语气略书面。它连接两个事物或情况，后项常与「も」呼应，表示递进关系。如「彼は英語ばかりでなく中国語も話せる」。","quiz":{"q":"彼は英語ばかりでなく ___ 。","options":["日本語も話せます","日本語を話します","日本語しか話せません","日本語を話せない"],"a":0,"explain":"「ばかりでなく…も」表递进，后项需用「も」呼应，表示还会说日语。"},"ex":[{"s":"彼は英語ばかりでなく日本語も話せます。","t":"他不仅会说英语，还会说日语。"},{"s":"この店は安いばかりでなくおいしいです。","t":"这家店不仅便宜而且好吃。"}]}}});

CURRICULUM.push({"d":97,"en":{"theme":"团队协作","words":[{"w":"collaboration","p":"/kəˌlæbəˈreɪʃn/","pos":"n.","cn":"协作；合作","ex":"The project was a great collaboration.","exCn":"这个项目是一次出色的合作。"},{"w":"coordination","p":"/kəʊˌɔːdɪˈneɪʃn/","pos":"n.","cn":"协调；配合","ex":"The event needs careful coordination.","exCn":"这次活动需要细致的协调。"},{"w":"camaraderie","p":"/ˌkæməˈrɑːdəri/","pos":"n.","cn":"情谊；同志情谊","ex":"The team built strong camaraderie.","exCn":"团队建立了深厚的情谊。"},{"w":"cohesion","p":"/kəʊˈhiːʒn/","pos":"n.","cn":"凝聚力；团结","ex":"Team cohesion is key to success.","exCn":"团队凝聚力是成功的关键。"},{"w":"solidarity","p":"/ˌsɒlɪˈdærəti/","pos":"n.","cn":"团结；一致","ex":"The workers showed great solidarity.","exCn":"工人们表现出极大的团结。"},{"w":"collegiality","p":"/kəˌliːdʒiˈæləti/","pos":"n.","cn":"同事情谊；协作精神","ex":"Collegiality among team members improves productivity.","exCn":"同事间的协作精神能提高效率。"},{"w":"unanimity","p":"/ˌjuːnəˈnɪməti/","pos":"n.","cn":"全体一致；一致同意","ex":"The board reached unanimity on the plan.","exCn":"董事会就该计划达成一致。"},{"w":"collective","p":"/kəˈlektɪv/","pos":"adj.","cn":"集体的；共同的","ex":"It was a collective effort by all.","exCn":"这是所有人的集体努力。"},{"w":"cooperative","p":"/kəʊˈɒpərətɪv/","pos":"adj.","cn":"合作的","ex":"They adopted a cooperative approach.","exCn":"他们采取了合作的方式。"},{"w":"facilitate","p":"/fəˈsɪlɪteɪt/","pos":"v.","cn":"促进；使便利","ex":"The new tool facilitates team communication.","exCn":"新工具促进了团队沟通。"}],"grammar":{"title":"倒装与强调综合","formula":"否定词/only/so 置于句首 → 部分倒装","cn":"否定副词 never、hardly、seldom，以及 only 加状语、so 加形容词副词置于句首时，主句都要部分倒装，把助动词或情态动词提前。强调句则用 It is/was...that 结构。两者都是写作中突出重点的手段。","quiz":{"q":"Never before ___ such a beautiful sight.","options":["have I seen","I have seen","I saw","did I saw"],"a":0,"explain":"Never 置于句首，主句部分倒装，现在完成时助动词 have 提前。"},"ex":[{"s":"Never before have I seen such a beautiful sight.","t":"我从未见过如此美丽的景象。"},{"s":"Hardly had he left when it rained.","t":"他刚离开就下雨了。"}]}},"ja":{"theme":"複合動詞","words":[{"k":"やり直す","y":"やりなおす","cn":"重做","ex":"宿題をやり直しました。","exCn":"重新做了作 CURRICULUM.push({"d":100,"en":{"theme":"易混词辨析","words":[{"w":"affect","p":"/əˈfekt/","pos":"v.","cn":"影响","ex":"The weather can affect our mood.","exCn":"天气会影响我们的情绪。"},{"w":"effect","p":"/ɪˈfekt/","pos":"n.","cn":"影响；效果","ex":"The new law had a positive effect.","exCn":"新法律产生了积极的效果。"},{"w":"principal","p":"/ˈprɪnsəpl/","pos":"adj.","cn":"主要的","ex":"The principal reason is lack of time.","exCn":"主要原因是缺乏时间。"},{"w":"stationary","p":"/ˈsteɪʃənri/","pos":"adj.","cn":"静止的；固定的","ex":"The car remained stationary at the light.","exCn":"汽车在红绿灯处保持静止。"},{"w":"complement","p":"/ˈkɒmplɪment/","pos":"v.","cn":"补充；补足","ex":"The wine complements the meal perfectly.","exCn":"这款酒和这道菜搭配完美。"},{"w":"compliment","p":"/ˈkɒmplɪmənt/","pos":"n.","cn":"赞美；恭维","ex":"She received many compliments on her dress.","exCn":"她的裙子收到了许多赞美。"},{"w":"adapt","p":"/əˈdæpt/","pos":"v.","cn":"适应；改编","ex":"Animals must adapt to the environment.","exCn":"动物必须适应环境。"},{"w":"adopt","p":"/əˈdɒpt/","pos":"v.","cn":"采用；收养","ex":"They decided to adopt a child.","exCn":"他们决定收养一个孩子。"},{"w":"assure","p":"/əˈʃʊə(r)/","pos":"v.","cn":"向…保证","ex":"He assured me that everything was fine.","exCn":"他向我保证一切都没问题。"},{"w":"ensure","p":"/ɪnˈʃʊə(r)/","pos":"v.","cn":"确保；保证","ex":"Please ensure the door is locked.","exCn":"请确保门已锁好。"}],"grammar":{"title":"100 天语法总复盘","formula":"时态 / 语态 / 虚拟 / 非谓语 / 从句综合","cn":"本日总结核心语法：时态要根据时间标志判断；被动语态强调动作承受者；虚拟语气表与事实相反的假设；非谓语看与逻辑主语的关系；各类从句看连接词在句中的成分。解题先定主干，再定修饰。","quiz":{"q":"By the time you arrive, we ___ the work.","options":["will have finished","will finish","finish","finished"],"a":0,"explain":"by the time 与将来时间连用，表示到那时已完成的动作，用将来完成时。"},"ex":[{"s":"By the time you arrive, we will have finished the work.","t":"等你到达时，我们将已完成这项工作。"},{"s":"If I had more time, I would learn Japanese.","t":"如果我有更多时间，我会学日语。"}]}},"ja":{"theme":"N4 総まとめ","words":[{"k":"経験","y":"けいけん","cn":"经验；经历","ex":"留学の経験があります。","exCn":"我有留学的经历。"},{"k":"目的","y":"もくてき","cn":"目的","ex":"目的を持って勉強します。","exCn":"带着目的学习。"},{"k":"方法","y":"ほうほう","cn":"方法","ex":"正しい方法で練習します。","exCn":"用正确的方法练习。"},{"k":"理由","y":"りゆう","cn":"理由","ex":"遅れた理由を説明しました。","exCn":"说明了迟到的理由。"},{"k":"原因","y":"げんいん","cn":"原因","ex":"事故の原因を調べています。","exCn":"正在调查事故原因。"},{"k":"予想","y":"よそう","cn":"预想；预料","ex":"予想より難しかったです。","exCn":"比预想的难。"},{"k":"比較","y":"ひかく","cn":"比较","ex":"二つの商品を比較しました。","exCn":"比较了两件商品。"},{"k":"選択","y":"せんたく","cn":"选择","ex":"正しい選択をしました。","exCn":"做了正确的选择。"},{"k":"協力","y":"きょうりょく","cn":"协力；合作","ex":"みんなで協力して完成しました。","exCn":"大家协力完成了。"},{"k":"挑戦","y":"ちょうせん","cn":"挑战","ex":"新しいことに挑戦します。","exCn":"挑战新事物。"}],"grammar":{"title":"N4 语法总复盘","formula":"综合：て形 / ない形 / た形 / ように / ために","cn":"本日复盘 N4 核心语法：て形表示连接和请求，ない形表示否定，た形表示过去和完成。此外「～ように」「～ために」表目的，「～こと」「～はず」「～わけ」等表达判断和语气。掌握这些是迈向 N3 的基础。","quiz":{"q":"健康のために、毎朝 ___ 。","options":["走ることにしています","走ることにします","走ります","走りました"],"a":0,"explain":"「健康のために」表目的，后接自己已决定的习惯，用「走ることにしている」。"},"ex":[{"s":"健康のために、毎朝走ることにしています。","t":"为了健康，我坚持每天晨跑。"},{"s":"日本語が上手になるように毎日勉強しています。","t":"为了学好日语，我每天学习。"}]}}});

<script>
(function(){
  "use strict";
  const DATA = CURRICULUM.slice().sort((a,b)=>a.d-b.d);
  const BY_DAY = {};
  DATA.forEach(d=>BY_DAY[d.d]=d);
  const KEY="jp100.v1";
  const TOTAL_ITEMS = 22;

  const S = { day:1, tab:"today", store:{}, q:"", quiz:null, quizMode:"mix", quizLang:"all", quizN:10 };

  /* ---------- storage ---------- */
  function loadStore(){
    try{ S.store = JSON.parse(localStorage.getItem(KEY)||"{}") || {}; }catch(e){ S.store={}; }
    if(!S.store.__dates) S.store.__dates = [];
  }
  function saveStore(){ try{ localStorage.setItem(KEY, JSON.stringify(S.store)); }catch(e){} }
  function rec(d){ if(!S.store[d]) S.store[d]={}; return S.store[d]; }
  function val(d,k){ const r=S.store[d]; return (r && r[k]) || 0; }
  function setVal(d,k,v){
    const r=rec(d);
    if(v===0) delete r[k]; else r[k]=v;
    const t=new Date(); const ds=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
    if(S.store.__dates.indexOf(ds)<0){ S.store.__dates.push(ds); if(S.store.__dates.length>400) S.store.__dates=S.store.__dates.slice(-400); }
    saveStore(); refreshChrome(); paintDayGrid();
    if(S.tab==="stats") renderStats();
  }
  function dayProgress(d){
    let done=0,seen=0;
    for(let i=0;i<10;i++){ const a=val(d,"e"+i); if(a===2)done++; if(a>=1)seen++; }
    for(let i=0;i<10;i++){ const a=val(d,"j"+i); if(a===2)done++; if(a>=1)seen++; }
    if(val(d,"gE")===2)done++; if(val(d,"gE")>=1)seen++;
    if(val(d,"gJ")===2)done++; if(val(d,"gJ")>=1)seen++;
    return {done,seen};
  }
  function totalMastered(){
    return DATA.reduce((s,d)=>s+dayProgress(d.d).done,0);
  }
  function todayCount(){
    const p=dayProgress(S.day); return p.done;
  }

  /* ---------- helpers ---------- */
  function esc(s){
    return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function defaultDay(){
    for(const d of DATA){ if(dayProgress(d.d).done < TOTAL_ITEMS) return d.d; }
    return DATA.length?DATA[DATA.length-1].d:1;
  }

  /* ---------- chrome ---------- */
  function refreshChrome(){
    const m=totalMastered(), total=DATA.length*TOTAL_ITEMS;
    const pct=total?Math.round(m/total*100):0;
    const ring=document.getElementById("ring");
    if(ring){ ring.style.setProperty("--p",pct); document.getElementById("ringNum").textContent=pct+"%"; }
    const rt=document.getElementById("ringTxt");
    if(rt) rt.textContent=m+" / "+total;
    const tc=dayProgress(S.day);
    const rs=document.getElementById("ringSub");
    if(rs) rs.textContent="Day "+S.day+" · 已学 "+tc.seen+" · 掌握 "+tc.done;
  }
  function paintDayGrid(){
    const g=document.getElementById("daygrid"); if(!g) return;
    let html="";
    DATA.forEach(d=>{
      const p=dayProgress(d.d);
      let cls="";
      if(p.done>=TOTAL_ITEMS) cls="done"; else if(p.seen>0) cls="part";
      if(d.d===S.day) cls+=" cur";
      html+='<button class="'+cls+'" data-day="'+d.d+'" title="Day '+d.d+'">'+d.d+'</button>';
    });
    g.innerHTML=html;
  }

  /* ---------- word / grammar cards ---------- */
  function wordCard(lang,key,item,day){
    const v=val(day,key);
    const cls="card "+(lang==="ja"?"ja ":"")+(v>=1?"seen ":"")+(v===2?"mastered":"");
    if(lang==="en"){
      return '<div class="'+cls+'" data-k="'+key+'">'
        +'<button class="star" data-star="'+key+'" title="标记掌握">'+(v===2?"★":"☆")+'</button>'
        +'<div class="w">'+esc(item.w)+'</div>'
        +'<div class="meta"><span class="pos">'+esc(item.pos||"")+'</span> '+esc(item.p||"")+'</div>'
        +'<div class="rv"><div class="cn">'+esc(item.cn)+'</div>'
        +'<div class="ex"><b>'+esc(item.ex)+'</b><span>'+esc(item.exCn||"")+'</span></div></div></div>';
    }
    return '<div class="'+cls+'" data-k="'+key+'">'
      +'<button class="star" data-star="'+key+'" title="标记掌握">'+(v===2?"★":"☆")+'</button>'
      +'<div class="w">'+esc(item.k)+'</div>'
      +'<div class="meta">'+esc(item.y||"")+'</div>'
      +'<div class="rv"><div class="cn">'+esc(item.cn)+'</div>'
      +'<div class="ex"><b>'+esc(item.ex)+'</b><span>'+esc(item.exCn||"")+'</span></div></div></div>';
  }
  function grammarCard(lang,key,g,day,no){
    const v=val(day,key);
    const cls="gcard"+(v===2?" mastered":"");
    const exs=(g.ex||[]).map(e=>'<li><b class="'+(lang==="ja"?"jp":"")+'">'+esc(e.s)+'</b><span>'+esc(e.t||"")+'</span></li>').join("");
    return '<div class="'+cls+'" data-gk="'+key+'">'
      +'<button class="star" data-star="'+key+'" title="标记掌握">'+(v===2?"★":"☆")+'</button>'
      +'<div class="gtop"><span class="gno">'+(lang==="en"?"EN":"JP")+' GRAMMAR '+String(no).padStart(2,"0")+'</span></div>'
      +'<h3>'+esc(g.title)+'</h3>'
      +'<div class="formula '+(lang==="ja"?"jp":"")+'">'+esc(g.formula)+'</div>'
      +'<p class="note">'+esc(g.cn)+'</p>'
      +'<ul>'+exs+'</ul></div>';
  }

  /* ---------- views ---------- */
  function renderToday(){
    const d=BY_DAY[S.day];
    const v=document.getElementById("view");
    if(!d){ v.innerHTML='<div class="empty">该天数据缺失。</div>'; return; }
    const p=dayProgress(S.day);
    let html='<div class="dayhead">'
      +'<div class="num"><small>DAY</small>'+String(d.d).padStart(2,"0")+'</div>'
      +'<div class="themes">'
        +'<span class="chip en">EN · '+esc(d.en.theme||"")+'</span>'
        +'<span class="chip ja">JP · '+esc(d.ja.theme||"")+'</span>'
      +'</div>'
      +'<div class="pct" id="dayMeter">'+dayMeterHTML(p)+'</div>'
      +'</div>';

    html+='<section class="block"><div class="blockhead"><span class="tag en">ENGLISH</span>'
      +'<h2>英语 · 10 词 + 1 语法</h2><span class="sub">'+(S.day<=40?"CET-4 核心":(S.day<=70?"CET-6 核心":"六级进阶 / 考研高频"))+'</span>'
      +'<div class="spacer"></div><button class="mini" data-act="openall" data-lang="en">展开全部</button></div>'
      +'<div class="grid">';
    (d.en.words||[]).forEach((w,i)=>{ html+=wordCard("en","e"+i,w,d.d); });
    html+='</div>'+grammarCard("en","gE",d.en.grammar,d.d,d.d)+'</section>';

    html+='<section class="block"><div class="blockhead"><span class="tag ja">日本語</span>'
      +'<h2>日语 · 10 词 + 1 语法</h2><span class="sub">'+(S.day<=60?"N5 基础":(S.day<=90?"N4 核心":"N4 进阶"))+'</span>'
      +'<div class="spacer"></div><button class="mini" data-act="openall" data-lang="ja">展开全部</button></div>'
      +'<div class="grid">';
    (d.ja.words||[]).forEach((w,i)=>{ html+=wordCard("ja","j"+i,w,d.d); });
    html+='</div>'+grammarCard("ja","gJ",d.ja.grammar,d.d,d.d)+'</section>';

    html+='<div style="color:var(--muted2);font-size:11.5px;padding:6px 2px">提示：点击卡片显示释义与例句，点右上角 ☆ 标记“已掌握”；<span class="kbd">←</span><span class="kbd">→</span> 切换 Day</div>';
    v.innerHTML=html;
  }

  function allItems(){
    const out=[];
    DATA.forEach(d=>{
      (d.en.words||[]).forEach((w,i)=>out.push({lang:"en",day:d.d,key:"e"+i,item:w}));
      (d.ja.words||[]).forEach((w,i)=>out.push({lang:"ja",day:d.d,key:"j"+i,item:w}));
      if(d.en.grammar) out.push({lang:"en",day:d.d,key:"gE",item:d.en.grammar,g:true});
      if(d.ja.grammar) out.push({lang:"ja",day:d.d,key:"gJ",item:d.ja.grammar,g:true});
    });
    return out;
  }

  /* ---------- quiz engine ---------- */
  const QT_LABEL = {spell:"拼写", trans:"翻译", listen:"听力", grammar:"语法", mix:"混合"};
  function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=r[i];r[i]=r[j];r[j]=t;} return r; }
  function sample(a,n){ return shuffle(a).slice(0,n); }
  function speak(text,lang){
    try{
      if(!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang=lang; u.rate=0.85; u.pitch=1;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  function masteredItems(){ return allItems().filter(it=>val(it.day,it.key)===2); }
  function wordExplain(it){
    const w=it.item;
    if(it.lang==="en") return esc(w.w)+" "+esc(w.p||"")+" · "+esc(w.pos||"")+" · "+esc(w.cn)+"<br>"+esc(w.ex)+" — "+esc(w.exCn||"");
    return esc(w.k)+"（"+esc(w.y)+"）· "+esc(w.cn)+"<br>"+esc(w.ex)+" — "+esc(w.exCn||"");
  }
  function makeOptions(lang, correct, getter, k){
    const seen=new Set([correct]); const dists=[];
    for(const x of shuffle(allItems().filter(x=>x.lang===lang && !x.g))){
      const t=getter(x.item);
      if(t && !seen.has(t)){ seen.add(t); dists.push(t); if(dists.length>=k) break; }
    }
    const opts=shuffle([correct].concat(dists));
    return {texts:opts, ans:opts.indexOf(correct)};
  }
  function buildWordQuestion(it, type){
    const w=it.item, lang=it.lang;
    if(lang==="en"){
      if(type==="spell"){
        return {type,lang,day:it.day,prompt:esc(w.cn),sub:esc(w.pos||"")+" · "+esc(w.p||""),input:true,answer:w.w,speak:null,explain:wordExplain(it)};
      }
      if(type==="trans"){
        const o=makeOptions("en",w.cn,x=>x.cn,3);
        return {type,lang,day:it.day,prompt:esc(w.w),sub:esc(w.p||"")+" · "+esc(w.pos||""),input:false,options:o.texts,ans:o.ans,speak:null,explain:wordExplain(it)};
      }
      if(type==="listen"){
        return {type,lang,day:it.day,prompt:"听发音，拼写你听到的单词",sub:"点击 🔊 可重播",input:true,answer:w.w,speak:{text:w.w,lang:"en-US"},explain:wordExplain(it)};
      }
    } else {
      if(type==="spell"){
        const o=makeOptions("ja",w.y,x=>x.y,3);
        return {type,lang,day:it.day,prompt:esc(w.k),sub:esc(w.cn)+" · 选出正确读音（平假名）",input:false,options:o.texts,ans:o.ans,speak:null,explain:wordExplain(it)};
      }
      if(type==="trans"){
        const o=makeOptions("ja",w.cn,x=>x.cn,3);
        return {type,lang,day:it.day,prompt:esc(w.k),sub:"选出正确的中文意思",input:false,options:o.texts,ans:o.ans,speak:null,explain:wordExplain(it)};
      }
      if(type==="listen"){
        const o=makeOptions("ja",w.cn,x=>x.cn,3);
        return {type,lang,day:it.day,prompt:"听发音，选出正确意思",sub:"点击 🔊 可重播",input:false,options:o.texts,ans:o.ans,speak:{text:w.y,lang:"ja-JP"},explain:wordExplain(it)};
      }
    }
    return null;
  }
  function buildGrammarQuestion(it){
    const g=it.item; if(!g.quiz) return null;
    return {type:"grammar",lang:it.lang,day:it.day,prompt:esc(g.quiz.q),sub:'<span class="gt">'+esc(g.title)+'</span><span class="gf'+(it.lang==="ja"?" jp":"")+'">'+esc(g.formula)+'</span>',input:false,options:g.quiz.options.slice(),ans:g.quiz.a,speak:null,explain:esc(g.quiz.explain||"")};
  }

  function renderQuizSetup(){
    const v=document.getElementById("view");
    const learned=masteredItems();
    const wN=learned.filter(x=>!x.g).length;
    const gN=learned.filter(x=>x.g && x.item.quiz).length;
    let html='<div class="dayhead"><div class="num"><small>随机</small>抽测</div>'
      +'<div class="themes"><span class="chip">已掌握 '+wN+' 词 · '+gN+' 语法</span></div></div>'
      +'<div class="panelbox quizsetup"><h3>只测「已掌握」的内容</h3>'
      +'<p class="qnote">单词/语法点右上角点 ☆ 标记为「掌握」后才会进入抽测范围；只点开看过、未标 ☆ 的不考。</p>'
      +'<div class="qrow"><span class="qlab">题型</span><div class="qchips" id="qtype">'
        +["mix","spell","trans","listen","grammar"].map((t,i)=>'<button class="chip pick'+(i===0?" sel":"")+'" data-t="'+t+'">'+QT_LABEL[t]+'</button>').join("")
      +'</div></div>'
      +'<div class="qrow"><span class="qlab">语言</span><div class="qchips" id="qlang">'
        +[["all","全部"],["en","英语"],["ja","日语"]].map((p,i)=>'<button class="chip pick'+(i===0?" sel":"")+'" data-t="'+p[0]+'">'+p[1]+'</button>').join("")
      +'</div></div>'
      +'<div class="qrow"><span class="qlab">题量</span><div class="qchips" id="qn">'
        +[5,10,20].map((n,i)=>'<button class="chip pick'+(i===1?" sel":"")+'" data-t="'+n+'">'+n+' 题</button>').join("")
      +'</div></div>'
      +'<button class="btn accent qstart" data-act="qstart">开始抽测</button></div>';
    v.innerHTML=html;
  }

  function startQuiz(){
    const mode=S.quizMode||"mix", lang=S.quizLang||"all", n=S.quizN||10;
    const learned=masteredItems();
    const wPool=learned.filter(x=>!x.g && (lang==="all"||x.lang===lang));
    const gPool=learned.filter(x=>x.g && x.item.quiz && (lang==="all"||x.lang===lang));
    let qs=[];
    if(mode==="grammar"){
      qs=sample(gPool,n).map(buildGrammarQuestion).filter(Boolean);
    } else if(mode==="mix"){
      const gens=[];
      wPool.forEach(it=>{ gens.push(()=>buildWordQuestion(it,"spell")); gens.push(()=>buildWordQuestion(it,"trans")); gens.push(()=>buildWordQuestion(it,"listen")); });
      gPool.forEach(it=>{ gens.push(()=>buildGrammarQuestion(it)); });
      qs=sample(gens,n).map(f=>f()).filter(Boolean);
    } else {
      qs=sample(wPool,n).map(it=>buildWordQuestion(it,mode)).filter(Boolean);
    }
    if(!qs.length){
      alert("还没有已掌握的内容。请先到「今日学习」把学过的单词/语法点右上角标上 ☆，再来抽测。");
      return;
    }
    S.quiz={mode,list:qs,idx:0,correct:0,answered:0};
    renderQuiz();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function renderQuiz(){
    const v=document.getElementById("view");
    const qz=S.quiz;
    if(!qz){ renderQuizSetup(); return; }
    if(qz.idx>=qz.list.length){ renderQuizResult(); return; }
    const q=qz.list[qz.idx], total=qz.list.length, idx=qz.idx;
    const progPct=Math.round(qz.answered/total*100);
    let html='<div class="dayhead"><div class="num"><small>抽测</small>Q'+(idx+1)+'/'+total+'</div>'
      +'<div class="themes"><span class="chip">'+QT_LABEL[q.type]+'</span><span class="chip '+(q.lang==="en"?"en":"ja")+'">'+(q.lang==="en"?"英语":"日语")+'</span></div>'
      +'<div class="pct">答对 '+qz.correct+'/'+qz.answered+' <div class="bar"><i style="width:'+progPct+'%"></i></div></div></div>';
    html+='<div class="quizcard">';
    if(q.speak) html+='<button class="speakbtn" data-act="qspeak">🔊 播放</button>';
    html+='<div class="qprompt'+(q.lang==="ja"?" jp":"")+'">'+q.prompt+'</div>';
    if(q.sub) html+='<div class="qsub">'+q.sub+'</div>';
    if(q.input){
      html+='<div class="qinputrow"><input id="qinput" type="text" placeholder="输入答案后回车或点确认" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn accent" data-act="qsubmit">确认</button></div>';
    } else if(q.options){
      html+='<div class="qopts">'+q.options.map((o,i)=>'<button class="opt'+(q.lang==="ja"?" jp":"")+'" data-opt="'+i+'">'+esc(o)+'</button>').join("")+'</div>';
    }
    if(q.result){
      html+='<div class="fb '+(q.result.correct?"ok":"no")+'">'+(q.result.correct?"✓ 正确":"✗ 错误")+' '+(q.result.note||"")+'</div>';
      html+='<div class="fbexplain">'+q.explain+'</div>';
      html+='<div style="margin-top:18px"><button class="btn accent" data-act="qnext">'+(idx+1>=total?"查看结果":"下一题")+'</button></div>';
    }
    html+='</div>';
    v.innerHTML=html;
    if(q.speak){ setTimeout(function(){ speak(q.speak.text,q.speak.lang); }, 120); }
  }

  function afterAnswer(ok, note){
    const qz=S.quiz; if(!qz) return;
    const q=qz.list[qz.idx];
    if(q.result) return;
    q.result={correct:ok, note:note};
    qz.answered++; if(ok) qz.correct++;
    renderQuiz();
  }
  function answerOption(i){
    const q=S.quiz.list[S.quiz.idx];
    if(q.result) return;
    const ok=(i===q.ans);
    afterAnswer(ok, ok?"":"正确答案："+esc(q.options[q.ans]));
  }
  function answerTyped(){
    const inp=document.getElementById("qinput"); if(!inp) return;
    const t=inp.value.trim().toLowerCase();
    if(!t) return;
    const q=S.quiz.list[S.quiz.idx];
    if(q.result) return;
    const ok=(t===String(q.answer).toLowerCase());
    afterAnswer(ok, ok?"":"正确答案："+esc(q.answer));
  }
  function nextQuestion(){
    const qz=S.quiz;
    qz.idx++;
    renderQuiz();
    window.scrollTo({top:0,behavior:"smooth"});
  }
  function renderQuizResult(){
    const v=document.getElementById("view");
    const qz=S.quiz, total=qz.list.length, ok=qz.correct;
    const pct=Math.round(ok/total*100);
    const msg=pct>=90?"非常棒！":(pct>=70?"很不错，继续保持":"再复习一下这些内容吧");
    let html='<div class="dayhead"><div class="num"><small>结果</small>'+ok+'/'+total+'</div>'
      +'<div class="themes"><span class="chip">正确率 '+pct+'%</span></div></div>'
      +'<div class="panelbox"><h3>'+msg+'</h3>'
      +'<div class="statgrid"><div class="stat"><small>答对</small><b>'+ok+'</b></div><div class="stat"><small>答错</small><b>'+(total-ok)+'</b></div><div class="stat"><small>正确率</small><b>'+pct+'<i>%</i></b></div></div>';
    const wrong=qz.list.filter(q=>q.result && !q.result.correct);
    if(wrong.length){
      html+='<h3 style="margin-top:22px;margin-bottom:10px">错题回顾</h3><div class="reslist">'+wrong.map(q=>{
        const ansText=(q.answer!=null)?q.answer:(q.options?q.options[q.ans]:"");
        return '<div class="res"><span class="rw">'+q.prompt+'</span><span class="rm">正确答案：'+esc(ansText)+'</span></div>';
      }).join("")+'</div>';
    }
    html+='<div style="margin-top:20px;display:flex;gap:10px"><button class="btn accent" data-act="qagain">再测一组</button><button class="btn" data-act="qback">返回设置</button></div></div>';
    v.innerHTML=html;
  }

  function renderReview(){
    const qz=S.quiz;
    if(!qz) renderQuizSetup();
    else if(qz.idx>=qz.list.length) renderQuizResult();
    else renderQuiz();
  }

  function renderStats(){
    const v=document.getElementById("view");
    const total=DATA.length*TOTAL_ITEMS;
    let mastered=0,seen=0;
    let enM=0,enT=0,jaM=0,jaT=0;
    let started=0;
    DATA.forEach(d=>{
      const p=dayProgress(d.d);
      mastered+=p.done; seen+=p.seen;
      if(p.seen>0) started++;
      enM+= (val(d.d,"gE")===2?1:0);
      for(let i=0;i<10;i++){ if(val(d.d,"e"+i)===2) enM++; }
      enT+=11;
      jaM+= (val(d.d,"gJ")===2?1:0);
      for(let i=0;i<10;i++){ if(val(d.d,"j"+i)===2) jaM++; }
      jaT+=11;
    });
    const dates=(S.store.__dates||[]).slice().sort();
    let streak=0;
    if(dates.length){
      const set={}; dates.forEach(x=>set[x]=1);
      const t=new Date(); const fmt=z=>z.getFullYear()+"-"+String(z.getMonth()+1).padStart(2,"0")+"-"+String(z.getDate()).padStart(2,"0");
      let cur=new Date(t);
      if(!set[fmt(cur)]) cur.setDate(cur.getDate()-1);
      while(set[fmt(cur)]){ streak++; cur.setDate(cur.getDate()-1); }
    }
    const pct=total?Math.round(mastered/total*100):0;

    let html='<div class="dayhead"><div class="num"><small>总览</small>进度</div>'
      +'<div class="themes"><span class="chip">共 '+DATA.length+' 天 · '+total+' 个知识点</span></div></div>';

    html+='<div class="statgrid">'
      +'<div class="stat"><small>总体掌握率</small><b>'+pct+'<i>%</i></b></div>'
      +'<div class="stat"><small>已掌握</small><b>'+mastered+'<i>项</i></b></div>'
      +'<div class="stat"><small>已学习</small><b>'+seen+'<i>项</i></b></div>'
      +'<div class="stat"><small>已开始天数</small><b>'+started+'<i>天</i></b></div>'
      +'<div class="stat"><small>连续学习</small><b>'+streak+'<i>天</i></b></div>'
      +'<div class="stat"><small>剩余知识点</small><b>'+(total-mastered)+'<i>项</i></b></div>'
      +'</div>';

    html+='<div class="panelbox"><h3>分语言进度</h3><div class="rows">'
      +'<div class="rowline"><span class="nm">英语</span><div class="bar"><i style="width:'+(enT?enM/enT*100:0)+'%;background:var(--en)"></i></div><span class="vl">'+enM+'/'+enT+'</span></div>'
      +'<div class="rowline"><span class="nm">日语</span><div class="bar"><i style="width:'+(jaT?jaM/jaT*100:0)+'%;background:var(--ja)"></i></div><span class="vl">'+jaM+'/'+jaT+'</span></div>'
      +'</div></div>';

    html+='<div class="panelbox"><h3>阶段进度</h3><div class="rows">';
    const phases=[[1,40,"CET-4 / N5 基础"],[41,70,"CET-6 / N5-N4"],[71,100,"进阶 / N4 进阶"]];
    phases.forEach(ph=>{
      let m=0,t=0;
      DATA.forEach(d=>{ if(d.d>=ph[0]&&d.d<=ph[1]){ const p=dayProgress(d.d); m+=p.done; t+=TOTAL_ITEMS; } });
      html+='<div class="rowline"><span class="nm">Day '+ph[0]+'–'+ph[1]+'</span><div class="bar"><i style="width:'+(t?m/t*100:0)+'%;background:linear-gradient(90deg,var(--en),var(--ja))"></i></div><span class="vl">'+m+'/'+t+'</span></div>';
    });
    html+='</div></div>';

    const weak=[];
    DATA.forEach(d=>{ const p=dayProgress(d.d); if(p.seen>0 && p.done<TOTAL_ITEMS) weak.push({d:d.d,p:p}); });
    weak.sort((a,b)=>(a.p.done-a.p.seen)-(b.p.done-b.p.seen));
    html+='<div class="panelbox"><h3>待巩固（已开始未完成）</h3>';
    if(!weak.length) html+='<div class="empty">暂无，去开始新的一天吧。</div>';
    else{
      html+='<div class="rows">'+weak.slice(0,8).map(x=>'<div class="rowline"><span class="nm">Day '+x.d+'</span><div class="bar"><i style="width:'+(x.p.done/TOTAL_ITEMS*100)+'%;background:var(--gold)"></i></div><span class="vl">'+x.p.done+'/'+TOTAL_ITEMS+'</span></div>').join("")+'</div>';
    }
    html+='</div>';
    v.innerHTML=html;
  }

  function renderSearch(){
    const v=document.getElementById("view");
    const q=S.q.trim().toLowerCase();
    const hits=[];
    const items=allItems();
    for(const it of items){
      const parts=[];
      if(it.g){ parts.push(it.item.title,it.item.formula,it.item.cn); }
      else if(it.lang==="en"){ parts.push(it.item.w,it.item.cn,it.item.ex); }
      else { parts.push(it.item.k,it.item.y,it.item.cn,it.item.ex); }
      const hay=parts.join(" ").toLowerCase();
      if(hay.indexOf(q)>=0) hits.push(it);
      if(hits.length>=80) break;
    }
    let html='<div class="dayhead"><div class="num"><small>搜索</small>'+esc(S.q)+'</div>'
      +'<div class="themes"><span class="chip">'+hits.length+' 条结果</span></div></div>';
    if(!hits.length){ html+='<div class="empty">没有找到匹配内容，试试更短的关键词。</div>'; }
    else{
      html+='<div class="reslist">'+hits.map(it=>{
        const w=it.g?("【语法】"+it.item.title):(it.lang==="en"?it.item.w:it.item.k);
        const m=it.g?it.item.formula:(it.lang==="ja"?(it.item.y+" · "+it.item.cn):it.item.cn);
        return '<div class="res" data-jump="'+it.day+'"><span class="rw '+(it.lang==="ja"?"jp":"")+'">'+esc(w)+'</span><span class="rm">'+esc(m)+'</span><span class="rd">Day '+it.day+' · '+(it.lang==="en"?"英":"日")+'</span></div>';
      }).join("")+'</div>';
    }
    v.innerHTML=html;
  }

  function render(){
    if(S.tab==="review") renderReview();
    else if(S.tab==="stats") renderStats();
    else renderToday();
    paintDayGrid(); refreshChrome();
  }

  /* ---------- events ---------- */
  document.getElementById("tabs").addEventListener("click",function(e){
    const b=e.target.closest("button[data-tab]"); if(!b) return;
    S.tab=b.getAttribute("data-tab");
    Array.prototype.forEach.call(this.children,function(c){ c.classList.toggle("on",c===b); });
    document.getElementById("q").value=""; S.q="";
    render();
  });

  document.getElementById("daygrid").addEventListener("click",function(e){
    const b=e.target.closest("button[data-day]"); if(!b) return;
    S.day=parseInt(b.getAttribute("data-day"),10);
    S.tab="today";
    Array.prototype.forEach.call(document.getElementById("tabs").children,function(c){ c.classList.toggle("on",c.getAttribute("data-tab")==="today"); });
    document.getElementById("q").value=""; S.q="";
    render(); window.scrollTo({top:0,behavior:"smooth"});
  });

  document.getElementById("view").addEventListener("click",function(e){
    const star=e.target.closest("[data-star]");
    const act=e.target.closest("[data-act]");
    const jump=e.target.closest("[data-jump]");
    const gk=e.target.closest("[data-gk]");
    const card=e.target.closest("[data-k]");

    if(act){
      const a=act.getAttribute("data-act");
      if(a==="qstart"){ startQuiz(); return; }
      if(a==="qspeak"){ const q=S.quiz&&S.quiz.list[S.quiz.idx]; if(q&&q.speak) speak(q.speak.text,q.speak.lang); return; }
      if(a==="qsubmit"){ answerTyped(); return; }
      if(a==="qnext"){ nextQuestion(); return; }
      if(a==="qagain"){ startQuiz(); return; }
      if(a==="qback"){ S.quiz=null; renderQuizSetup(); return; }
      if(a==="openall"){
        const cards=this.querySelectorAll(".grid .card");
        const openCount=[].filter.call(cards,function(c){return c.classList.contains("open");}).length;
        [].forEach.call(cards,function(c){ c.classList.toggle("open", openCount<cards.length); });
        return;
      }
    }
    const pick=e.target.closest(".pick");
    if(pick){
      const group=pick.closest("#qtype,#qlang,#qn");
      if(group){
        Array.prototype.forEach.call(group.children,function(c){ c.classList.remove("sel"); });
        pick.classList.add("sel");
        const id=group.id, t=pick.getAttribute("data-t");
        if(id==="qtype") S.quizMode=t;
        else if(id==="qlang") S.quizLang=t;
        else if(id==="qn") S.quizN=parseInt(t,10);
      }
      return;
    }
    const opt=e.target.closest("[data-opt]");
    if(opt && S.quiz){ answerOption(parseInt(opt.getAttribute("data-opt"),10)); return; }
    if(jump){
      S.day=parseInt(jump.getAttribute("data-jump"),10);
      S.q=""; document.getElementById("q").value="";
      S.tab="today";
      Array.prototype.forEach.call(document.getElementById("tabs").children,function(c){ c.classList.toggle("on",c.getAttribute("data-tab")==="today"); });
      render(); window.scrollTo({top:0,behavior:"smooth"}); return;
    }
    if(star){
      e.stopPropagation();
      const k=star.getAttribute("data-star");
      const holder=star.closest("[data-k],[data-gk]");
      const cur=val(S.day,k);
      const next= cur===2?1:2;
      setVal(S.day,k,next);
      if(holder){
        holder.classList.toggle("mastered",next===2);
        holder.classList.toggle("seen",true);
        star.textContent=next===2?"★":"☆";
      }
      updateDayMeter();
      return;
    }
    if(card){
      const k=card.getAttribute("data-k");
      const wasOpen=card.classList.contains("open");
      card.classList.toggle("open");
      if(!wasOpen && val(S.day,k)===0){ setVal(S.day,k,1); card.classList.add("seen"); }
      updateDayMeter();
      return;
    }
    if(gk){
      const k=gk.getAttribute("data-gk");
      if(val(S.day,k)===0){ setVal(S.day,k,1); }
      updateDayMeter();
      return;
    }
  });

  function dayMeterHTML(p){
    const seenPct=Math.round(p.seen/TOTAL_ITEMS*100);
    return '<span>已学 <b>'+p.seen+'</b>/'+TOTAL_ITEMS+' · 掌握 <b>'+p.done+'</b>/'+TOTAL_ITEMS+'</span>'
      +'<div class="bar"><i style="width:'+seenPct+'%"></i></div>';
  }
  function updateDayMeter(){
    const el=document.getElementById("dayMeter");
    if(el) el.innerHTML=dayMeterHTML(dayProgress(S.day));
    refreshChrome();
  }

  var qtimer=null;
  document.getElementById("q").addEventListener("input",function(){
    S.q=this.value;
    clearTimeout(qtimer);
    qtimer=setTimeout(function(){
      if(S.q.trim()){ S.tab="search"; renderSearch(); }
      else { S.tab="today"; render(); }
    },160);
  });

  document.getElementById("themeBtn").addEventListener("click",function(){
    document.body.classList.toggle("light");
    try{ localStorage.setItem("jp100.theme", document.body.classList.contains("light")?"light":"dark"); }catch(e){}
  });

  document.addEventListener("keydown",function(e){
    if(e.target && e.target.id==="qinput" && e.key==="Enter"){ answerTyped(); return; }
    if(e.target.tagName==="INPUT") return;
    if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
      const days=DATA.map(d=>d.d);
      const i=days.indexOf(S.day);
      const n=i+(e.key==="ArrowRight"?1:-1);
      if(n>=0&&n<days.length){
        S.day=days[n]; S.tab="today";
        Array.prototype.forEach.call(document.getElementById("tabs").children,function(c){ c.classList.toggle("on",c.getAttribute("data-tab")==="today"); });
        render(); window.scrollTo({top:0,behavior:"smooth"});
      }
    }
  });

  /* ---------- boot ---------- */
  loadStore();
  try{ if(localStorage.getItem("jp100.theme")==="light") document.body.classList.add("light"); }catch(e){}
  S.day = defaultDay();
  render();
})();
</script>
</body>
</html>
